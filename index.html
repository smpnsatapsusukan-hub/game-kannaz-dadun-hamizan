<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kannaz — Sudoku IPA SD Kelas 2</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Segoe UI',sans-serif}
  body{min-height:100vh;background:linear-gradient(160deg,#a8e6cf,#dcedc1 45%,#ffd3b6);display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:520px;background:rgba(255,255,255,.92);border-radius:26px;padding:22px 18px;box-shadow:0 18px 45px rgba(0,80,60,.25);text-align:center}
  h1{color:#1b5e20;font-size:30px;letter-spacing:1px}
  .sub{color:#33691e;font-weight:700;margin:6px 0 14px}
  .mascot{font-size:52px;animation:bounce 2.2s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bar{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px;font-weight:800;color:#2e7d32}
  .chip{background:#e8f5e9;border:2px solid #81c784;border-radius:14px;padding:8px 10px;font-size:14px}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:390px;margin:0 auto}
  .cell{aspect-ratio:1;border-radius:14px;background:#fff;border:3px solid #a5d6a7;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;transition:.15s;user-select:none}
  .cell:hover{transform:scale(1.05);border-color:#66bb6a}
  .cell.active{border-color:#ff9800;background:#fff8e1;transform:scale(1.06)}
  .cell.fixed{background:#e0f2f1;cursor:not-allowed}
  .cell.right{background:#c8e6c9;border-color:#43a047;animation:pop .35s}
  .cell.wrong{background:#ffcdd2;border-color:#e53935;animation:shake .35s}
  .cell.b1{border-bottom-width:6px}.cell.b2{border-right-width:6px}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .choices{display:flex;justify-content:center;gap:10px;margin:16px 0 10px}
  .choice{font-size:30px;background:#fff;border:3px solid #81c784;border-radius:16px;width:62px;height:62px;cursor:pointer;transition:.15s}
  .choice:hover{transform:scale(1.12);background:#e8f5e9}
  button.act{background:#43a047;color:#fff;border:0;border-radius:14px;padding:11px 18px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #2e7d32}
  button.act:active{transform:translateY(3px);box-shadow:none}
  .msg{min-height:26px;font-weight:800;color:#1b5e20;margin-top:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:22px;padding:26px;max-width:360px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.3)}
  .card h2{color:#2e7d32;margin-bottom:8px}
  .card p{color:#555;margin-bottom:14px}
  .confetti{position:fixed;top:-12px;font-size:24px;animation:fall 2.6s linear forwards;pointer-events:none;z-index:9}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mascot">🌱🐶</div>
  <h1>KANNAZ</h1>
  <div class="sub">Sudoku IPA: Bagian Tubuh Hewan &amp; Tumbuhan</div>
  <div class="bar">
    <div class="chip">⭐ Nilai: <span id="score">0</span></div>
    <div class="chip">🔥 Benar: <span id="correct">0</span></div>
    <div class="chip">⏱️ <span id="timer">0</span> detik</div>
  </div>
  <div class="board" id="board"></div>
  <div class="choices" id="choices"></div>
  <div class="msg" id="msg">Pilih kotak, lalu pilih gambar yang benar!</div>
  <button class="act" onclick="newGame()">🔄 Main Lagi</button>
  <button class="act" style="background:#fb8c00;box-shadow:0 4px 0 #ef6c00" onclick="toggleSound()" id="soundBtn">🔊 Suara: ON</button>
</div>

<div class="modal" id="modal">
  <div class="card">
    <div style="font-size:56px">🏆🌱</div>
    <h2>Hebat, Kamu Berhasil!</h2>
    <p>Semua kotak KANNAZ sudah benar.<br>Nilai akhirmu: <b id="finalScore">0</b></p>
    <button class="act" onclick="newGame()">Main Lagi 🎮</button>
  </div>
</div>

<script>
const ICONS=['🌱','🍃','🌸','🐾'];
const NAMES={ '🌱':'Akar','🍃':'Daun','🌸':'Bunga','🐾':'Hewan' };
let puzzle, solution, selected=null, score=0, correct=0, timer=0, soundOn=true, solved=false, tick;

const PUZZLES=[
 {p:[0,1,0,2, 2,0,1,0, 1,0,0,3, 0,3,2,0], s:[3,1,4,2, 2,4,1,3, 1,2,3,4, 4,3,2,1]},
 {p:[1,0,0,3, 0,3,1,0, 0,1,3,0, 3,0,0,1], s:[1,2,4,3, 4,3,1,2, 2,1,3,4, 3,4,2,1]},
 {p:[0,3,0,1, 1,0,3,0, 3,0,1,0, 0,1,0,3], s:[2,3,4,1, 1,4,3,2, 3,2,1,4, 4,1,2,3]}
];

function beep(freq,dur,type='sine',vol=.18){
  if(!soundOn)return;
  const c=new (window.AudioContext||window.webkitAudioContext)();
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(c.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.stop(c.currentTime+dur);
}
function correctSound(){beep(660,.12);setTimeout(()=>beep(880,.18),110)}
function wrongSound(){beep(180,.22,'square',.12)}
function winSound(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*130))}

function newGame(){
  clearInterval(tick);timer=0;score=0;correct=0;solved=false;selected=null;
  document.getElementById('score').textContent=0;
  document.getElementById('correct').textContent=0;
  document.getElementById('timer').textContent=0;
  document.getElementById('modal').style.display='none';
  const pick=PUZZLES[Math.floor(Math.random()*PUZZLES.length)];
  puzzle=pick.p.slice();solution=pick.s.slice();
  render();startTimer();
  document.getElementById('msg').textContent='Pilih kotak, lalu pilih gambar yang benar!';
}

function render(){
  const board=document.getElementById('board');board.innerHTML='';
  puzzle.forEach((v,i)=>{
    const d=document.createElement('div');
    d.className='cell'+(i%2===1?' b2':'')+((i>=4&&i<8)||(i>=12)?' b1':'')+(v?' fixed':'');
    d.textContent=v?ICONS[v-1]:'';
    d.dataset.i=i;
    if(!v)d.onclick=()=>selectCell(i);
    board.appendChild(d);
  });
  const ch=document.getElementById('choices');ch.innerHTML='';
  ICONS.forEach((ic,idx)=>{
    const b=document.createElement('button');
    b.className='choice';b.textContent=ic;b.title=NAMES[ic];
    b.onclick=()=>place(idx+1);
    ch.appendChild(b);
  });
}

function selectCell(i){
  if(solved)return;
  selected=i;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('active'));
  document.querySelector(`[data-i="${i}"]`).classList.add('active');
  document.getElementById('msg').textContent='Pilih gambar untuk kotak ini!';
}

function place(val){
  if(solved||selected===null){document.getElementById('msg').textContent='Pilih salah satu kotak kosong dulu!';wrongSound();return;}
  const cell=document.querySelector(`[data-i="${selected}"]`);
  if(val===solution[selected]){
    puzzle[selected]=val;cell.textContent=ICONS[val-1];
    cell.classList.add('right');correctSound();
    score+=10+Math.max(0,10-timer/10|0);correct++;
    document.getElementById('score').textContent=score;
    document.getElementById('correct').textContent=correct;
    document.getElementById('msg').textContent='Benar! '+NAMES[ICONS[val-1]]+' +10 poin ⭐';
    selected=null;cell.classList.remove('active');
    if(!puzzle.includes(0))finish();
  }else{
    cell.classList.add('wrong');wrongSound();
    document.getElementById('msg').textContent='Belum tepat. Coba pikirkan lagi! 🤔';
    setTimeout(()=>cell.classList.remove('wrong'),400);
  }
}

function finish(){
  solved=true;clearInterval(tick);winSound();
  document.getElementById('finalScore').textContent=score;
  document.getElementById('modal').style.display='flex';
  for(let i=0;i<40;i++){
    const s=document.createElement('div');s.className='confetti';
    s.textContent=['🌱','🍃','🌸','🐾','⭐','🎉'][i%6];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*1.2+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4000);
  }
}

function startTimer(){
  tick=setInterval(()=>{timer++;document.getElementById('timer').textContent=timer;},1000);
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔊 Suara: ON':'🔇 Suara: OFF';
}

newGame();
</script>
</body>
</html>
